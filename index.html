<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الكيبورد - مجمع مدرستي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0284c7',        /* أزرق */
                        amberOrange: '#f59e0b',      /* أصفر برتقالي */
                        amberOrangeDark: '#d97706',  /* أصفر برتقالي داكن للتأثيرات */
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&display=swap');
        body { font-family: 'Alexandria', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .key-highlight { fill: #f59e0b !important; stroke: #d97706 !important; }
        .key-text-highlight { fill: #ffffff !important; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-brandBlue p-2 rounded-xl text-white shadow-lg">
                <i class="fa-solid fa-graduation-cap text-lg"></i>
            </div>
            <span class="font-extrabold text-lg text-amberOrange" data-i18n="schoolName">مجمع مدرستي</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="langBtn" onclick="toggleLang()" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 rounded-lg border border-slate-700 hover:bg-slate-700">English</button>
            <button id="themeBtn" onclick="toggleTheme()" class="p-2 bg-slate-800 rounded-lg border border-slate-700 hover:bg-slate-700 text-amberOrange">
                <i id="themeIcon" class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto p-4 flex-1 w-full flex flex-col justify-center">
        
        <!-- PAGE 1: Home / Device Selection -->
        <div id="pageHome" class="space-y-6 text-center">
            <div class="space-y-2">
                <h1 class="text-2xl font-bold text-white" data-i18n="title">اختر نظام تشغيل جهازك</h1>
                <p class="text-xs text-slate-400" data-i18n="subtitle">حدد نظام الجهاز لعرض طريقة الضبط وتغيير اللغة</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button onclick="showDetails('ios')" class="p-5 bg-slate-800 border-2 border-slate-700 hover:border-brandBlue rounded-2xl flex flex-col items-center gap-3 transition group">
                    <i class="fa-brands fa-apple text-4xl text-brandBlue group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold text-sm">iOS / iPadOS</span>
                </button>
                <button onclick="showDetails('android')" class="p-5 bg-slate-800 border-2 border-slate-700 hover:border-amberOrange rounded-2xl flex flex-col items-center gap-3 transition group">
                    <i class="fa-brands fa-android text-4xl text-amberOrange group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold text-sm">Android</span>
                </button>
                <button onclick="showDetails('windows')" class="p-5 bg-slate-800 border-2 border-slate-700 hover:border-amberOrange rounded-2xl flex flex-col items-center gap-3 transition group">
                    <i class="fa-brands fa-windows text-4xl text-amberOrange group-hover:scale-110 transition-transform"></i>
                    <span class="font-bold text-sm">Windows</span>
                </button>
            </div>
        </div>

        <!-- PAGE 2: Details & Instructions -->
        <div id="pageDetails" class="hidden space-y-6">
            <!-- Back Button -->
            <button onclick="goHome()" class="inline-flex items-center gap-2 text-xs font-bold text-amberOrange bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 hover:bg-slate-700 transition">
                <i class="fa-solid fa-arrow-right dir-rtl:block hidden"></i>
                <i class="fa-solid fa-arrow-left dir-ltr:block hidden"></i>
                <span data-i18n="back">رجوع للقائمة الرئيسية</span>
            </button>

            <h2 id="deviceTitle" class="text-xl font-bold text-brandBlue border-b border-slate-800 pb-2"></h2>

            <!-- Step 1: System Mode -->
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="font-bold text-amberOrange text-sm" data-i18n="step1">1. تحديد نظام الجهاز (يُضغط مرة واحدة):</h3>
                <p id="step1Text" class="text-xs text-slate-300"></p>
                
                <!-- Visual Keyboard Graphic -->
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-center">
                    <svg viewBox="0 0 300 90" class="w-full max-w-xs">
                        <rect width="300" height="90" rx="8" fill="#0f172a"/>
                        <!-- Fn Key -->
                        <rect id="key-fn" x="15" y="55" width="28" height="22" rx="4" fill="#334155" stroke="#475569"/>
                        <text x="29" y="69" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="bold">Fn</text>
                        <!-- A Key -->
                        <rect id="key-a" x="35" y="28" width="22" height="22" rx="4" fill="#334155" stroke="#475569"/>
                        <text id="text-a" x="46" y="42" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="bold">A</text>
                        <!-- S Key -->
                        <rect id="key-s" x="60" y="28" width="22" height="22" rx="4" fill="#334155" stroke="#475569"/>
                        <text id="text-s" x="71" y="42" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="bold">S</text>
                        <!-- D Key -->
                        <rect id="key-d" x="85" y="28" width="22" height="22" rx="4" fill="#334155" stroke="#475569"/>
                        <text id="text-d" x="96" y="42" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="bold">D</text>
                    </svg>
                </div>
            </div>

            <!-- Step 2: Switch Language -->
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="font-bold text-amberOrange text-sm" data-i18n="step2">2. طريقة تغيير اللغة (عربي / إنجليزي):</h3>
                <p id="step2Text" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>

            <!-- Global Note: Adding Keyboard Language in System Settings -->
            <div class="bg-amber-950/30 border border-amber-500/40 p-4 rounded-2xl space-y-2">
                <h3 class="font-bold text-amberOrange text-xs" data-i18n="addLangTitle">💡 كيف تضيف اللغة العربية للكيبورد من إعدادات جهازك؟</h3>
                <p id="addLangText" class="text-xs text-amber-200/90 leading-relaxed font-medium"></p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="p-3 text-center text-xs text-slate-500 border-t border-slate-800">
        <span data-i18n="footer">جميع الحقوق محفوظة - مجمع مدرستي</span>
    </footer>

    <script>
        const i18n = {
            ar: {
                schoolName: "مجمع مدرستي",
                title: "اختر نظام تشغيل جهازك",
                subtitle: "حدد نظام الجهاز لعرض طريقة الضبط وتغيير اللغة",
                back: "رجوع للقائمة الرئيسية",
                step1: "1. تحديد نظام الجهاز (يُضغط مرة واحدة):",
                step2: "2. طريقة تغيير اللغة (عربي / إنجليزي):",
                addLangTitle: "💡 كيف تضيف اللغة العربية للكيبورد من إعدادات جهازك؟",
                footer: "جميع الحقوق محفوظة - مجمع مدرستي",
                iosAdd: "الإعدادات 👈 عام 👈 لوحة المفاتيح 👈 لوحات المفاتيح 👈 إضافة لوحة مفاتيح جديدة 👈 اختر اللغة العربية.",
                androidAdd: "الإعدادات 👈 الإدارة العامة 👈 لوحة المفاتيح الخارجية 👈 اختر اسم الكيبورد 👈 اضف اللغة العربية.",
                winAdd: "الإعدادات 👈 الوقت واللغة 👈 اللغة والمنطقة 👈 إضافة لغة 👈 اختر العربية.",
            },
            en: {
                schoolName: "Madrasati Complex",
                title: "Select Your Operating System",
                subtitle: "Choose your device OS to view setup instructions",
                back: "Back to Main Menu",
                step1: "1. Set System Mode (Press once):",
                step2: "2. Switch Input Language:",
                addLangTitle: "💡 How to add Arabic language in your device settings:",
                footer: "All Rights Reserved - Madrasati Complex",
                iosAdd: "Settings 👈 General 👈 Keyboard 👈 Keyboards 👈 Add New Keyboard 👈 Select Arabic.",
                androidAdd: "Settings 👈 General Management 👈 Physical Keyboard 👈 Tap Keyboard Name 👈 Add Arabic.",
                winAdd: "Settings 👈 Time & Language 👈 Language & Region 👈 Add a language 👈 Select Arabic.",
            }
        };

        let currentLang = 'ar';

        function showDetails(system) {
            document.getElementById('pageHome').classList.add('hidden');
            document.getElementById('pageDetails').classList.remove('hidden');

            ['key-fn', 'key-a', 'key-s', 'key-d'].forEach(id => {
                document.getElementById(id).classList.remove('key-highlight');
            });
            ['text-a', 'text-s', 'text-d'].forEach(id => {
                document.getElementById(id).classList.remove('key-text-highlight');
            });

            document.getElementById('key-fn').classList.add('key-highlight');

            if(system === 'ios') {
                document.getElementById('deviceTitle').innerText = "iOS / iPadOS (آيفون / آيباد)";
                document.getElementById('step1Text').innerHTML = "اضغط على <b class='text-amberOrange'>Fn + A</b> معاً.";
                document.getElementById('step2Text').innerHTML = "الطريقة الرئيسية: <b class='text-amberOrange'>Shift + Space</b> <br> (أو زر Caps Lock إذا كان مفعّلاً).";
                document.getElementById('addLangText').innerText = i18n[currentLang].iosAdd;
                
                document.getElementById('key-a').classList.add('key-highlight');
                document.getElementById('text-a').classList.add('key-text-highlight');
            } else if(system === 'android') {
                document.getElementById('deviceTitle').innerText = "Android (أندرويد)";
                document.getElementById('step1Text').innerHTML = "اضغط على <b class='text-amberOrange'>Fn + S</b> معاً.";
                document.getElementById('step2Text').innerHTML = "الطريقة الأولى: <b class='text-amberOrange'>Win + Space</b> <br> الطريقة الثانية: <b>Shift + Space</b>";
                document.getElementById('addLangText').innerText = i18n[currentLang].androidAdd;

                document.getElementById('key-s').classList.add('key-highlight');
                document.getElementById('text-s').classList.add('key-text-highlight');
            } else {
                document.getElementById('deviceTitle').innerText = "Windows (ويندوز)";
                document.getElementById('step1Text').innerHTML = "اضغط على <b class='text-amberOrange'>Fn + D</b> معاً.";
                document.getElementById('step2Text').innerHTML = "الطريقة الأولى: <b class='text-amberOrange'>Alt + Shift</b> <br> الطريقة الثانية: <b>Win + Space</b>";
                document.getElementById('addLangText').innerText = i18n[currentLang].winAdd;

                document.getElementById('key-d').classList.add('key-highlight');
                document.getElementById('text-d').classList.add('key-text-highlight');
            }
        }

        function goHome() {
            document.getElementById('pageDetails').classList.add('hidden');
            document.getElementById('pageHome').classList.remove('hidden');
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = i18n[currentLang][key];
            });
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if(isDark) {
                document.body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between";
                icon.className = "fa-solid fa-sun";
            } else {
                document.body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between";
                icon.className = "fa-solid fa-moon text-slate-700";
            }
        }
    </script>
</body>
</html>
