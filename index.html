<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل لوحة مفاتيح AOAS | AOAS Keyboard Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700;800&family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Alexandria', 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .key-cap {
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            border: 1px solid #cbd5e1;
            border-bottom: 4px solid #94a3b8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.15s ease;
        }

        .dark .key-cap {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border: 1px solid #475569;
            border-bottom: 4px solid #0f172a;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            color: #f8fafc;
        }

        .key-cap:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .device-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .device-card.active {
            border-color: #0ea5e9;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.25);
        }

        /* Smooth fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-500 text-white p-2.5 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-center">
                    <i class="fa-solid font-bold fa-keyboard text-xl"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white leading-tight">AOAS Keyboard</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" data-i18n="subtitle">الدليل التفاعلي السريع</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Language Toggle -->
                <button id="langToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-globe text-slate-500"></i>
                    <span id="langText">English</span>
                </button>

                <!-- Dark Mode Toggle -->
                <button id="themeToggleBtn" aria-label="Toggle Theme" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full flex flex-col gap-8">

        <!-- Title / Intro Section -->
        <div class="text-center space-y-2">
            <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white" data-i18n="selectTitle">
                اختر نظام تشغيل جهازك
            </h2>
            <p class="text-sm sm:text-base text-slate-600 dark:text-slate-400 max-w-xl mx-auto" data-i18n="selectDesc">
                قم بتحديد نظام التشغيل الذي تريد ربط الكيبورد به لعرض الاختصارات والإعدادات المناسبة له.
            </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            
            <!-- iOS Button -->
            <button onclick="selectDevice('ios')" id="btn-ios" class="device-card active bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 hover:border-brand-500 dark:hover:border-brand-500 p-5 rounded-2xl text-center cursor-pointer flex sm:flex-col items-center justify-start sm:justify-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-2xl flex-shrink-0">
                    <i class="fa-brands fa-apple"></i>
                </div>
                <div class="text-right sm:text-center">
                    <h3 class="font-bold text-base text-slate-900 dark:text-white">iOS / iPadOS</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">آيفون / آيباد / ماك</p>
                </div>
            </button>

            <!-- Android Button -->
            <button onclick="selectDevice('android')" id="btn-android" class="device-card bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 hover:border-brand-500 dark:hover:border-brand-500 p-5 rounded-2xl text-center cursor-pointer flex sm:flex-col items-center justify-start sm:justify-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-2xl flex-shrink-0">
                    <i class="fa-brands fa-android"></i>
                </div>
                <div class="text-right sm:text-center">
                    <h3 class="font-bold text-base text-slate-900 dark:text-white">Android</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">أجهزة أندرويد</p>
                </div>
            </button>

            <!-- Windows Button -->
            <button onclick="selectDevice('windows')" id="btn-windows" class="device-card bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 hover:border-brand-500 dark:hover:border-brand-500 p-5 rounded-2xl text-center cursor-pointer flex sm:flex-col items-center justify-start sm:justify-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-2xl flex-shrink-0">
                    <i class="fa-brands fa-windows"></i>
                </div>
                <div class="text-right sm:text-center">
                    <h3 class="font-bold text-base text-slate-900 dark:text-white">Windows</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">كمبيوتر ويندوز</p>
                </div>
            </button>

        </div>

        <div id="instructionsContainer" class="space-y-6">
            <!-- Dynamic instructions render here -->
        </div>

    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 bg-white dark:bg-slate-900 text-center text-xs text-slate-500 dark:text-slate-400">
        <p data-i18n="footerText">دليل استخدام لوحة مفاتيح AOAS المتنقلة - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        // Translations Dictionary
        const translations = {
            ar: {
                subtitle: "الدليل التفاعلي السريع",
                selectTitle: "اختر نظام تشغيل جهازك",
                selectDesc: "اضغط على نظام الجهاز الذي تستخدمه حالياً لعرض تعليمات الضبط وتغيير اللغة الخاصة به.",
                step1Title: "الخطوة الأولى: ضبط وضع النظام",
                step1Desc: "اضغط الزرين معاً مرة واحدة عند أول توصيل بالكيبورد لتكييف الأزرار مع نظامك:",
                step2Title: "الخطوة الثانية: تبديل لغة الكتابة",
                step2Desc: "استخدم الاختصار التالي للتحويل بين اللغة العربية والإنجليزية بسرعة:",
                androidNoteTitle: "💡 تحذير مهم لمستخدمي نظام أندرويد:",
                androidNoteDesc: "إذا لم تتغير اللغة معك بعد تجربة الاختصار، تأكد من إضافة اللغة العربية داخل إعدادات لوحة المفاتيح الخارجية من الهاتف عبر المسار التالي:",
                androidPath: "الإعدادات 👈 الإدارة العامة (أو النظام) 👈 لوحة المفاتيح الهيكلية/الخارجية 👈 إضافة اللغة العربية",
                footerText: "دليل استخدام لوحة مفاتيح AOAS المتنقلة",
                sysSetBtn: "ضبط النظام",
                langChangeBtn: "تغيير اللغة",
                or: "أو"
            },
            en: {
                subtitle: "Quick Interactive Guide",
                selectTitle: "Select Your Device System",
                selectDesc: "Click on your current operating system to display matching shortcut keys and layout setup instructions.",
                step1Title: "Step 1: Set Operating System Mode",
                step1Desc: "Press these keys together once upon connecting to match keyboard layout to your device:",
                step2Title: "Step 2: Switch Input Language",
                step2Desc: "Use this key combination to switch between Arabic and English:",
                androidNoteTitle: "💡 Important Note for Android Users:",
                androidNoteDesc: "If the language doesn't switch, ensure Arabic is added in your phone settings under external keyboard layout:",
                androidPath: "Settings 👈 General Management (or System) 👈 Physical Keyboard 👈 Add Arabic Language",
                footerText: "AOAS Portable Keyboard Interactive Manual",
                sysSetBtn: "Set System",
                langChangeBtn: "Switch Language",
                or: "OR"
            }
        };

        // App State
        let currentLang = 'ar';
        let currentDevice = 'ios';

        // Device Data
        const deviceData = {
            ios: {
                setKey: ['Fn', 'A'],
                langKeys: [['Shift', 'Space']],
                badgeColor: 'blue'
            },
            android: {
                setKey: ['Fn', 'S'],
                langKeys: [['Win', 'Space'], ['Shift', 'Space']],
                hasNote: true,
                badgeColor: 'emerald'
            },
            windows: {
                setKey: ['Fn', 'D'],
                langKeys: [['Alt', 'Shift'], ['Win', 'Space']],
                badgeColor: 'indigo'
            }
        };

        // UI Element References
        const langToggleBtn = document.getElementById('langToggleBtn');
        const langText = document.getElementById('langText');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const instructionsContainer = document.getElementById('instructionsContainer');

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            // Check stored dark mode or system preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            updateThemeIcon();
            renderInstructions();
        });

        // Toggle Dark/Light Mode
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            updateThemeIcon();
        });

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-slate-600';
        }

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            langText.textContent = currentLang === 'ar' ? 'English' : 'عربي';

            // Update static elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });

            renderInstructions();
        });

        function selectDevice(device) {
            currentDevice = device;

            // Highlight Active Card
            document.querySelectorAll('.device-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`btn-${device}`).classList.add('active');

            renderInstructions();
        }

        function renderInstructions() {
            const data = deviceData[currentDevice];
            const t = translations[currentLang];

            // Render Keyboard Key Markup
            const renderKey = (keyText) => `
                <kbd class="key-cap px-3.5 py-2 rounded-xl text-sm font-bold tracking-wider inline-flex items-center justify-center min-w-[42px]">
                    ${keyText}
                </kbd>
            `;

            const renderShortcutGroup = (keys) => `
                <div class="flex items-center gap-2 dir-ltr">
                    ${keys.map((k, idx) => `
                        ${renderKey(k)}
                        ${idx < keys.length - 1 ? '<span class="text-slate-400 font-bold">+</span>' : ''}
                    `).join('')}
                </div>
            `;

            // Build html markup
            let html = `
                <div class="animate-fade-in space-y-6">
                    
                    <!-- Step 1 Card -->
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="w-8 h-8 rounded-full bg-brand-500 text-white font-bold flex items-center justify-center text-sm">1</span>
                            <h3 class="font-bold text-lg text-slate-900 dark:text-white">${t.step1Title}</h3>
                        </div>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-5 leading-relaxed">${t.step1Desc}</p>
                        
                        <div class="bg-slate-50 dark:bg-slate-950/60 p-4 rounded-xl border border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4">
                            <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">${t.sysSetBtn}:</span>
                            ${renderShortcutGroup(data.setKey)}
                        </div>
                    </div>

                    <!-- Step 2 Card -->
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="w-8 h-8 rounded-full bg-brand-500 text-white font-bold flex items-center justify-center text-sm">2</span>
                            <h3 class="font-bold text-lg text-slate-900 dark:text-white">${t.step2Title}</h3>
                        </div>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-5 leading-relaxed">${t.step2Desc}</p>
                        
                        <div class="bg-slate-50 dark:bg-slate-950/60 p-4 rounded-xl border border-slate-100 dark:border-slate-800 space-y-3">
                            ${data.langKeys.map((group, i) => `
                                <div class="flex flex-wrap items-center justify-between gap-4">
                                    <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">${t.langChangeBtn} ${data.langKeys.length > 1 ? `(${i+1})` : ''}:</span>
                                    ${renderShortcutGroup(group)}
                                </div>
                                ${i < data.langKeys.length - 1 ? `<div class="text-center my-1"><span class="text-xs text-slate-400 font-bold">${t.or}</span></div>` : ''}
                            `).join('')}
                        </div>
                    </div>

                    <!-- Android Settings Note Card -->
                    ${data.hasNote ? `
                        <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 rounded-2xl p-6 text-amber-900 dark:text-amber-200">
                            <h4 class="font-bold text-base mb-2">${t.androidNoteTitle}</h4>
                            <p class="text-xs sm:text-sm leading-relaxed mb-3">${t.androidNoteDesc}</p>
                            <div class="bg-amber-100/70 dark:bg-amber-900/40 p-3 rounded-xl font-semibold text-xs sm:text-sm text-amber-950 dark:text-amber-100">
                                ${t.androidPath}
                            </div>
                        </div>
                    ` : ''}

                </div>
            `;

            instructionsContainer.innerHTML = html;
        }
    </script>
</body>
</html>
